syntax = "proto3";

package product;

option go_package = "github.com/NguyenDung278/E-CommerceMicroservicesPlatform/proto";

// Source of truth for Product gRPC contracts. Generated Go files in this
// directory are derived from this schema and should not be edited manually.

// Service definition
service ProductService {
  // Get all products
  rpc GetProducts (GetProductsRequest) returns (GetProductsResponse);
  
  // Get product by ID
  rpc GetProductByID (GetProductByIDRequest) returns (GetProductByIDResponse);
  
  // Create product (admin only)
  rpc CreateProduct (CreateProductRequest) returns (CreateProductResponse);
  
  // Update product (admin only)
  rpc UpdateProduct (UpdateProductRequest) returns (UpdateProductResponse);
  
  // Delete product (admin only)
  rpc DeleteProduct (DeleteProductRequest) returns (DeleteProductResponse);
  
  // Search products
  rpc SearchProducts (SearchProductsRequest) returns (SearchProductsResponse);

  // Reserve stock for one order: all-or-nothing across items, idempotent per
  // order_id. Replaying the same order_id must not decrement stock twice.
  rpc ReserveStock (ReserveStockRequest) returns (ReserveStockResponse);

  // Release every active reservation of one order back into stock. Idempotent:
  // releasing an unknown or already-released order is a successful no-op.
  rpc ReleaseStock (ReleaseStockRequest) returns (ReleaseStockResponse);
}

// Get products request.
//
// NOTE: This is offset/page-style pagination, which is different from the
// cursor-based shape used by some HTTP catalog endpoints in the repo.
message GetProductsRequest {
  int32 page = 1;
  int32 limit = 2;
  string category = 3;
  string sort_by = 4;
}

// Get products response
message GetProductsResponse {
  repeated Product products = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 limit = 4;
}

// Get product by ID request
message GetProductByIDRequest {
  string product_id = 1;
}

// Get product by ID response
message GetProductByIDResponse {
  Product product = 1;
}

// Create product request
message CreateProductRequest {
  string name = 1;
  string description = 2;
  float price = 3;
  string category = 4;
  int32 stock_quantity = 5;
  string image_url = 6;
}

// Create product response
message CreateProductResponse {
  Product product = 1;
}

// Update product request.
//
// IMPORTANT: Because this schema uses plain proto3 scalar fields (string/float/
// int32) instead of optional/wrapper types, the contract behaves closer to a
// full snapshot update than a partial patch update. Callers should be careful
// not to overwrite fields unintentionally with zero values.
message UpdateProductRequest {
  string product_id = 1;
  string name = 2;
  string description = 3;
  float price = 4;
  string category = 5;
  int32 stock_quantity = 6;
  string image_url = 7;
}

// Update product response
message UpdateProductResponse {
  Product product = 1;
}

// Delete product request
message DeleteProductRequest {
  string product_id = 1;
}

// Delete product response
message DeleteProductResponse {
  bool success = 1;
}

// Search products request
message SearchProductsRequest {
  string query = 1;
  int32 page = 2;
  int32 limit = 3;
}

// Search products response
message SearchProductsResponse {
  repeated Product products = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 limit = 4;
}

// One reserved line item inside a stock reservation.
//
// sku selects which variant of the product is being held. An empty sku means
// the reservation targets the product-level stock pool, which is only valid for
// products that declare no variants. Products that do declare variants require
// a non-empty sku, otherwise the reservation is ambiguous and would let two
// sizes of the same product drain one shared counter.
message StockReservationItem {
  string product_id = 1;
  int32 quantity = 2;
  string sku = 3;
}

// Reserve stock request. order_id doubles as the idempotency key of the whole
// reservation; items must be the full item list of that order.
message ReserveStockRequest {
  string order_id = 1;
  repeated StockReservationItem items = 2;
}

// Reserve stock response. already_reserved is true when the order_id was
// reserved by an earlier call and stock was left untouched.
message ReserveStockResponse {
  bool already_reserved = 1;
}

// Release stock request. Only order_id is needed; the product-service ledger
// remembers which items are still held.
message ReleaseStockRequest {
  string order_id = 1;
}

// Release stock response. released_items counts reservation rows flipped from
// active to released by this call (0 on idempotent replays).
message ReleaseStockResponse {
  int32 released_items = 1;
}

// One purchasable variant of a product, identified by sku within its product.
//
// price and stock here override the product-level values: a caller pricing a
// line item that carries a sku must read them from the matching variant, not
// from Product.price / Product.stock_quantity.
message ProductVariant {
  string sku = 1;
  string label = 2;
  string size = 3;
  string color = 4;
  float price = 5;
  int32 stock = 6;
}

// Product model.
//
// Compatibility note:
// - price is currently encoded as float, which is convenient but not ideal for money
// - created_at / updated_at are ISO-8601 strings emitted by the current Go server
// Future improvements should prefer additive migration instead of changing the
// meaning or type of these existing fields in place.
//
// stock_quantity stays the aggregate across every variant, so catalog listings
// and "out of stock" badges keep working unchanged. Buying decisions for a
// product with variants must use the per-variant stock in `variants` instead.
message Product {
  string id = 1;
  string name = 2;
  string description = 3;
  float price = 4;
  string category = 5;
  int32 stock_quantity = 6;
  string image_url = 7;
  string created_at = 8;
  string updated_at = 9;
  repeated ProductVariant variants = 10;
}
