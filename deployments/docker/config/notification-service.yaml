server:
  port: "8086"
  host: "0.0.0.0"

redis:
  host: "redis"
  port: "6379"
  db: 0

notification:
  worker_count: 4
  prefetch_count: 8
  max_retries: 5
  retry_delay_seconds: 30
  retry_max_delay_seconds: 300
  inbox_ttl_hours: 168
  processing_ttl_seconds: 300
  queue_metrics_interval_seconds: 15
  wishlist_poll_interval_seconds: 300
  wishlist_batch_limit: 50
  low_stock_poll_interval_seconds: 900
  low_stock_threshold: 5
  low_stock_batch_limit: 50
  # Để trống thì worker cảnh báo tồn kho không chạy. Đặt qua
  # NOTIFICATION_LOW_STOCK_RECIPIENTS trong .env.local khi muốn bật.
  low_stock_recipients: ""

services:
  user_service: "http://user-service:8081"
  product_service: "http://product-service:8082"

rabbitmq:
  host: "rabbitmq"
  port: "5672"
  user: "admin"

tracing:
  enabled: true
  endpoint: "http://jaeger:4318"
  sample_ratio: 1.0

smtp:
  host: ""
  port: "587"
  username: ""
  from_name: "ND Shop"
  from_address: ""
